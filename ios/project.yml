name: LifeLane
options:
  bundleIdPrefix: com.lifelane
  deploymentTarget:
    iOS: "15.0"
targets:
  LifeLane:
    type: application
    platform: iOS
    sources: [LifeLane]
    info:
      path: LifeLane/Info.plist
      properties:
        CFBundleDisplayName: LIFELANE
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: "LIFELANE uses Bluetooth to receive nearby ambulance alerts, even without internet."
        NSLocationWhenInUseUsageDescription: "LIFELANE uses your location (no internet needed) to alert you only when you are in the ambulance's way."
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lifelane.ble.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  LifeLane:
    build:
      targets:
        LifeLane: all
