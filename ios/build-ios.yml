name: Build iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild -project LifeLane.xcodeproj -scheme LifeLane -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LifeLane.app Payload/
          zip -qr LifeLane-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LifeLane-iOS-ipa
          path: ios/LifeLane-unsigned.ipa
